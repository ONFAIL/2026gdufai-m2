name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一分支上来新提交时取消旧的跑批，省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install / typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本取自根 package.json 的 packageManager 字段（pnpm@12.21.0）

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 关键：全新 runner + frozen lockfile，杜绝「我本机是好的」。
      # 若 pnpm-workspace.yaml 的 allowBuilds 配置错误，这里会直接
      # ERR_PNPM_IGNORED_BUILDS 失败——CI 的价值就在于抓住这类问题。
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (backend + frontend)
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test (backend + frontend)
        run: pnpm -r test

      - name: Build frontend
        run: pnpm --filter frontend build
